<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>操縦 — ころとも β版</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page control">
    <!-- 止めるは、いつも一番上に -->
    <button type="button" class="stop" id="stop" hidden>■ 止める</button>

    <section class="card" id="pair">
      <h2>🤖 ロボットとつなぐ</h2>
      <p class="small muted">ロボットの画面で「新しい番号を出す」を押して、出た6けたを入れます。</p>
      <form id="pair-form" style="display:grid;gap:10px">
        <label class="field">番号 <input name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="off"></label>
        <label class="field">このスマホの名前 <input name="name" type="text" maxlength="20" required placeholder="おとうさんのスマホ"></label>
        <button class="btn" type="submit">つなぐ</button>
      </form>
    </section>

    <div id="ctl" hidden style="display:grid;gap:14px">
      <p class="banner stopped" id="stopped" hidden>止まっています。まわりの安全を確かめてから「解除」してください。</p>
      <p class="banner lost" id="lost" hidden>ロボットとの合図が途切れています。ロボットは自分で止まります。</p>
      <div class="pad" id="pad" aria-label="押しているあいだ動く">
        <span class="blank"></span><button type="button" data-dir="f" aria-label="前">▲</button><span class="blank"></span>
        <button type="button" data-dir="l" aria-label="左">◀</button><button type="button" data-dir="b" aria-label="後ろ">▼</button><button type="button" data-dir="r" aria-label="右">▶</button>
      </div>
      <section class="card">
        <label class="field">速さ <input type="range" id="speed" min="10" max="80" value="25"></label>
        <p class="small muted">いまの上限：<strong id="max">－</strong>（こえた分は、ロボットが切ります）</p>
        <div class="row">
          <button type="button" class="btn ghost" id="release">解除</button>
          <button type="button" class="btn ghost" id="unlock">上限を60に（2台の同意）</button>
        </div>
        <p class="small muted" id="agree"></p>
      </section>
      <p class="small muted">つないだ名前：<strong id="me"></strong>　<button type="button" class="btn ghost" id="forget" style="min-height:32px;padding:2px 12px">このスマホの登録を消す</button></p>
    </div>
    <p class="error" id="error" role="alert"></p>
  </main>
  <script type="module" src="/control.js"></script>
</body>
</html>
